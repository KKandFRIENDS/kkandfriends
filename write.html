<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0E1A">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글쓰기 · Write — KK &amp; Friends</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member.css">
<style>
  main { max-width: 1080px; }
  .editor-head { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px; }
  .editor-head .status { font-size:13.5px; color:var(--text-muted); }
  .title-input { width:100%; background:transparent; border:none; border-bottom:1px solid var(--border);
    color:var(--text-primary); font-family:'Playfair Display','Noto Serif KR',serif; font-size:28px; padding:10px 2px; margin-bottom:16px; }
  .title-input:focus { outline:none; border-color:var(--gold); }
  .title-input::placeholder { color:var(--text-muted); }
  .meta-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .meta-row select { background:var(--bg-panel); border:1px solid var(--border); border-radius:4px; color:var(--text-primary); font-family:inherit; font-size:14.5px; padding:9px 12px; }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .toolbar button { background:var(--bg-card); border:1px solid var(--border); color:var(--text-secondary);
    font-family:inherit; font-size:14px; padding:7px 12px; border-radius:4px; cursor:pointer; transition:all .15s; }
  .toolbar button:hover { border-color:var(--border-bright); color:var(--text-primary); }
  .split { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:820px){ .split { grid-template-columns:1fr; } .preview-pane.mobile-hide { display:none; } }
  textarea.body { width:100%; min-height:460px; resize:vertical; background:var(--bg-panel); border:1px solid var(--border);
    border-radius:6px; color:var(--text-primary); font-family:'Source Serif 4','Noto Serif KR',serif; font-size:16px; line-height:1.8; padding:16px; }
  textarea.body:focus { outline:none; border-color:var(--gold); }
  .preview-pane { border:1px solid var(--border); border-radius:6px; padding:16px 20px; min-height:460px; background:var(--bg-card); overflow-x:auto; }
  .preview-label { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; }
  .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:20px; align-items:center; }
  .actions .spacer { flex:1; }
  /* rendered content styling (shared look for preview + /voices) */
  .rendered { color:var(--text-secondary); font-size:16.5px; line-height:1.85; word-break:keep-all; }
  .rendered h2 { font-family:'Playfair Display','Noto Serif KR',serif; color:var(--text-primary); font-size:24px; margin:26px 0 12px; }
  .rendered h3 { font-family:'Playfair Display','Noto Serif KR',serif; color:var(--text-primary); font-size:20px; margin:22px 0 10px; }
  .rendered h4 { color:var(--gold-light); font-size:17px; margin:18px 0 8px; }
  .rendered p { margin:0 0 14px; }
  .rendered a { color:var(--gold); text-decoration:underline; }
  .rendered strong { color:var(--text-primary); }
  .rendered ul, .rendered ol { padding-left:22px; margin:0 0 14px; }
  .rendered li { margin-bottom:6px; }
  .rendered blockquote { border-left:3px solid var(--gold-dim); padding:4px 16px; margin:0 0 16px; color:var(--text-muted); font-style:italic; }
  .rendered img { max-width:100%; height:auto; border-radius:4px; margin:10px 0; }
  .rendered code { background:var(--bg-hover); padding:2px 6px; border-radius:3px; font-size:.92em; }
  .rendered pre { background:var(--bg-hover); padding:14px 16px; border-radius:6px; overflow-x:auto; margin:0 0 16px; }
  .rendered pre code { background:none; padding:0; }
  .rendered hr { border:none; border-top:1px solid var(--border); margin:24px 0; }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <img src="/KK_and_FRIENDS.png" alt="KK & Friends">
    <span class="nav-logo-text">
      <span class="nav-logo-kk">KK &amp; FRIENDS</span>
      <span class="nav-logo-sub">Friends' Voices</span>
    </span>
  </a>
  <div class="nav-right"><a href="/voices">← 라운지</a></div>
</nav>

<main>
  <div id="root"><div class="spinner"></div></div>
</main>

<script type="module">
import {
  isConfigured, getClient, currentUser, signInWithGoogle, signOut, fetchMyProfile, esc, POST_CATEGORIES,
} from "/js/auth.js";
import { renderMarkdown } from "/js/markdown.js";

const root = document.getElementById("root");
const params = new URLSearchParams(location.search);
const editId = params.get("id");
let post = null;   // existing post when editing
let user = null;

boot();
async function boot() {
  if (!isConfigured()) { root.innerHTML = `<div class="banner error">회원 시스템이 아직 연결되지 않았습니다.</div>`; return; }
  user = await currentUser();
  if (!user) {
    root.innerHTML = `<div class="card center stack"><h2>글을 쓰려면 로그인이 필요합니다</h2>
      <button class="btn" id="signin">Google로 로그인</button></div>`;
    document.getElementById("signin").onclick = () => signInWithGoogle(location.href);
    return;
  }
  const profile = await fetchMyProfile();
  if (!profile || profile.status !== "approved") {
    root.innerHTML = `<div class="banner pending">글쓰기는 승인된 멤버만 가능합니다. ${profile && profile.status === "pending" ? "현재 심사 중입니다." : ""}</div>
      <div class="center"><a class="btn btn-ghost" href="/join">가입 페이지로</a></div>`;
    return;
  }
  if (editId) {
    const sb = getClient();
    const { data } = await sb.from("member_posts").select("*").eq("id", editId).maybeSingle();
    if (!data) { root.innerHTML = `<div class="banner error">글을 찾을 수 없거나 편집 권한이 없습니다.</div>`; return; }
    post = data;
  }
  renderEditor();
}

function renderEditor() {
  const cats = POST_CATEGORIES.map((c) => `<option value="${esc(c)}" ${post && post.category === c ? "selected" : ""}>${esc(c)}</option>`).join("");
  const isPublished = post && post.status === "published";
  root.innerHTML = `
    <div class="editor-head">
      <div class="eyebrow" style="text-align:left;margin:0;">${editId ? "글 수정" : "새 글"}</div>
      <div class="status" id="status">${isPublished ? "발행됨" : editId ? "임시저장 상태" : "작성 중"}</div>
    </div>

    <input class="title-input" id="title" maxlength="200" placeholder="제목을 입력하세요" value="${post ? esc(post.title) : ""}">

    <div class="meta-row">
      <label class="muted" style="font-size:14px;">분류</label>
      <select id="category"><option value="">— 분류 선택 —</option>${cats}</select>
    </div>

    <div class="toolbar" id="toolbar">
      <button data-md="h2">제목</button>
      <button data-md="bold"><b>B</b></button>
      <button data-md="italic"><i>I</i></button>
      <button data-md="quote">❝ 인용</button>
      <button data-md="ul">• 목록</button>
      <button data-md="link">🔗 링크</button>
      <button data-md="img">🖼 이미지</button>
      <button data-md="code">&lt;/&gt; 코드</button>
      <button data-md="preview" id="toggle-preview" style="margin-left:auto;">👁 미리보기</button>
    </div>

    <div class="split" id="split">
      <textarea class="body" id="body" placeholder="이야기를 들려주세요.&#10;&#10;서식 도움말: **굵게**  *기울임*  # 제목  &gt; 인용  - 목록  [링크](https://…)  ![이미지](https://…)">${post ? esc(post.body) : ""}</textarea>
      <div class="preview-pane mobile-hide" id="preview-pane">
        <div class="preview-label">미리보기</div>
        <div class="rendered" id="preview"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-ghost" id="save">${isPublished ? "변경사항 저장" : "임시저장"}</button>
      ${isPublished
        ? `<button class="btn" id="update-pub">발행 업데이트</button>
           <button class="btn btn-outline" id="unpub">발행 취소</button>`
        : `<button class="btn" id="publish">발행하기</button>`}
      <span class="spacer"></span>
      ${editId ? `<button class="btn btn-danger" id="delete">삭제</button>` : ""}
      <a class="btn btn-ghost" href="/voices">취소</a>
    </div>
    <div class="msg" id="msg" style="margin-top:12px;"></div>`;

  const bodyEl = document.getElementById("body");
  const previewEl = document.getElementById("preview");
  const updatePreview = () => { previewEl.innerHTML = renderMarkdown(bodyEl.value); };
  bodyEl.addEventListener("input", updatePreview);
  updatePreview();

  // toolbar
  document.getElementById("toolbar").addEventListener("click", (e) => {
    const btn = e.target.closest("button"); if (!btn) return;
    const md = btn.dataset.md;
    if (md === "preview") { document.getElementById("preview-pane").classList.toggle("mobile-hide"); return; }
    applyFormat(bodyEl, md); updatePreview();
  });

  document.getElementById("save").onclick = () => save("keep");
  const pub = document.getElementById("publish"); if (pub) pub.onclick = () => save("published");
  const upub = document.getElementById("update-pub"); if (upub) upub.onclick = () => save("published");
  const un = document.getElementById("unpub"); if (un) un.onclick = () => save("draft");
  const del = document.getElementById("delete"); if (del) del.onclick = onDelete;
}

function applyFormat(ta, kind) {
  const s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s, e);
  const wrap = (b, a = b) => ta.setRangeText(b + (sel || "") + a, s, e, "end");
  const linePrefix = (p) => ta.setRangeText(p + (sel || ""), s, e, "end");
  switch (kind) {
    case "bold": wrap("**"); break;
    case "italic": wrap("*"); break;
    case "code": sel.includes("\n") ? wrap("```\n", "\n```") : wrap("`"); break;
    case "h2": linePrefix("\n## "); break;
    case "quote": linePrefix("\n> "); break;
    case "ul": linePrefix("\n- "); break;
    case "link": {
      const url = prompt("링크 주소 (https://…)"); if (!url) break;
      ta.setRangeText(`[${sel || "링크 텍스트"}](${url})`, s, e, "end"); break;
    }
    case "img": {
      const url = prompt("이미지 주소 (https://…)"); if (!url) break;
      ta.setRangeText(`![${sel || "이미지 설명"}](${url})`, s, e, "end"); break;
    }
  }
  ta.focus();
}

function collect() {
  return {
    title: document.getElementById("title").value.trim(),
    category: document.getElementById("category").value || null,
    body: document.getElementById("body").value.trim(),
  };
}

async function save(mode) {
  const msg = document.getElementById("msg");
  msg.className = "msg"; msg.textContent = "";
  const data = collect();
  if (!data.title) { msg.className = "msg error"; msg.textContent = "제목을 입력해 주세요."; return; }
  if (!data.body) { msg.className = "msg error"; msg.textContent = "내용을 입력해 주세요."; return; }

  const sb = getClient();
  const payload = { title: data.title, category: data.category, body: data.body };
  if (mode === "published") { payload.status = "published"; payload.published_at = post?.published_at || new Date().toISOString(); }
  else if (mode === "draft") { payload.status = "draft"; }
  // mode "keep": leave status as-is (or draft for a brand-new post)

  msg.className = "msg"; msg.textContent = "저장 중…";
  try {
    if (post) {
      const { error } = await sb.from("member_posts").update(payload).eq("id", post.id);
      if (error) throw error;
      post = { ...post, ...payload };
    } else {
      if (!payload.status) payload.status = "draft";
      payload.author_id = user.id;
      const { data: inserted, error } = await sb.from("member_posts").insert(payload).select().single();
      if (error) throw error;
      post = inserted;
      history.replaceState(null, "", `/write?id=${post.id}`);
    }
    if (mode === "published") { location.href = `/voices?id=${post.id}`; return; }
    msg.className = "msg ok"; msg.textContent = "저장되었습니다.";
    renderEditor(); // refresh button states
  } catch (err) {
    msg.className = "msg error"; msg.textContent = "저장 실패: " + (err.message || err);
  }
}

async function onDelete() {
  if (!confirm("이 글을 삭제할까요? 되돌릴 수 없습니다.")) return;
  const sb = getClient();
  const { error } = await sb.from("member_posts").delete().eq("id", post.id);
  if (error) { document.getElementById("msg").className = "msg error"; document.getElementById("msg").textContent = "삭제 실패: " + error.message; return; }
  location.href = "/voices";
}
</script>
</body>
</html>
