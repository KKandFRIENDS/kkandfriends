<body>

<nav>
  <a class="nav-logo" href="/">

    <span class="nav-logo-text">

  </div>
</nav>

<main>
  <div class="eyebrow">Membership</div>
  <h1 class="page-title">KK &amp; Friends 가입</h1>
  <p class="lede">한국·글로벌 금융시장의 전문가들이 서로의 견해를 나누는 회원제 커뮤니티입니다. Google로 시작하고 간단한 프로필을 작성하면, 운영자(KK)가 직접 검토해 승인합니다.</p>

  <div id="root">
    <div class="spinner"></div>
  </div>
</main>

<footer>
  <div class="footer-logo">KK<span>&</span>FRIENDS</div>
  <p>© 2026 KK &amp; Friends.</p>
  <div style="display:flex;gap:20px;">
    <a href="/terms">이용약관</a>
    <a href="/privacy">개인정보처리방침</a>
  </div>
</footer>

<script type="module">
import {
  isConfigured, getClient, currentUser, onAuthChange,
  signInWithGoogle, signOut, fetchMyProfile, esc, IDENTITY_FIELDS,
  signInButtonsHtml, wireSignIn,
} from "/js/auth.js";

const root = document.getElementById("root");

boot();

async function boot() {
  if (!isConfigured()) {
    root.innerHTML = `<div class="banner error">회원 시스템이 아직 연결되지 않았습니다. (config.js에 Supabase 정보를 입력하세요.)</div>`;
    return;
  }
  onAuthChange(() => render());
  await render();
}

async function render() {
  const user = await currentUser();
  if (!user) return renderSignedOut();

  let profile = await fetchMyProfile();
  // The profile row is created by a DB trigger on first sign-in; if the OAuth
  // round-trip beat the trigger, retry once shortly.
  if (!profile) {
    await new Promise((r) => setTimeout(r, 900));
    profile = await fetchMyProfile();
  }
  if (!profile) return renderError("프로필을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.");

  if (!profile.onboarded) return renderOnboarding(user, profile);
  return renderStatus(user, profile);
}

function renderSignedOut() {
  root.innerHTML = `
    <div class="card center stack">
      <h2>시작하기</h2>
      <p class="muted">Google 또는 카카오 계정으로 시작합니다. 이메일은 본인 확인과 승인 안내에만 사용되며 공개되지 않습니다.</p>
      ${signInButtonsHtml()}
      <p class="muted" style="font-size:12.5px;">계속을 누르면 <a href="/terms" style="color:var(--gold);">이용약관</a> 및 <a href="/privacy" style="color:var(--gold);">개인정보처리방침</a>에 동의하는 것으로 간주됩니다.</p>
    </div>`;
  wireSignIn(root, "/join");
}

function renderError(text) {
  root.innerHTML = `<div class="banner error">${esc(text)}</div>
    <div class="center"><button class="btn btn-ghost" id="out">로그아웃</button></div>`;
  document.getElementById("out").onclick = async () => { await signOut(); render(); };
}

function renderOnboarding(user, p) {
  const fieldOpts = IDENTITY_FIELDS.map(
    (f) => `<option value="${esc(f)}" ${p.field === f ? "selected" : ""}>${esc(f)}</option>`
  ).join("");
  const realChecked = (p.identity_mode || "pseudonym") === "real";

  root.innerHTML = `
    <div class="banner">서명하신 Google 계정: <b>${esc(user.email || "")}</b> — 이 이메일은 공개되지 않습니다.</div>
    <form id="onb" class="card stack" novalidate>
      <h2>프로필 작성</h2>

      <div class="field">
        <label>사이트에서 어떻게 보이길 원하십니까?</label>
        <div class="segmented">
          <div style="flex:1;position:relative;">
            <input type="radio" name="mode" value="real" id="m-real" ${realChecked ? "checked" : ""}>
            <label for="m-real" class="${realChecked ? "checked" : ""}"><span class="t">실명</span><span class="d">이름·소속 공개 (선택)</span></label>
          </div>
          <div style="flex:1;position:relative;">
            <input type="radio" name="mode" value="pseudonym" id="m-pseud" ${!realChecked ? "checked" : ""}>
            <label for="m-pseud" class="${!realChecked ? "checked" : ""}"><span class="t">필명</span><span class="d">예: 전 증권사 채권운용역</span></label>
          </div>
        </div>
        <span class="hint">가입 심사는 실제 경력으로 이뤄지되, 사이트 표시는 두 방식 중 선택할 수 있습니다. 검증된 방(房), 선택하는 정체성.</span>
      </div>

      <div class="field">
        <label for="display_name">표시 이름 <span style="color:var(--red)">*</span></label>
        <input type="text" id="display_name" maxlength="60" value="${esc(p.display_name || "")}" placeholder="사이트에 표시될 이름 또는 필명">
        <div class="identity-preview" id="preview"></div>
      </div>

      <div class="field">
        <label for="real_name">본명 <span class="muted">(심사용 · 비공개)</span></label>
        <input type="text" id="real_name" maxlength="60" value="${esc(p.real_name || "")}" placeholder="운영자 검토용 실명">
        <span class="hint">필명을 선택하셔도, 승인 심사를 위해 본명은 받습니다. 운영자(KK) 외에는 공개되지 않습니다.</span>
      </div>

      <div class="field">
        <label for="field">전문 분야 <span style="color:var(--red)">*</span></label>
        <select id="field"><option value="">— 선택 —</option>${fieldOpts}</select>
      </div>

      <div class="field">
        <label for="affiliation">소속 <span class="muted">(회사/기관 · 선택)</span></label>
        <input type="text" id="affiliation" maxlength="120" value="${esc(p.affiliation || "")}" placeholder="예: ○○증권 채권운용본부">
        <div class="check-row" style="margin-top:12px;">
          <input type="checkbox" id="show_affiliation" ${p.show_affiliation ? "checked" : ""}>
          <label for="show_affiliation">소속을 프로필에 공개합니다 (실명 선택 시 권장, 필명 시 비공개 유지 권장).</label>
        </div>
      </div>

      <div class="field">
        <label for="career_summary">경력 소개 <span class="muted">(선택 · 최대 1000자)</span></label>
        <textarea id="career_summary" maxlength="1000" placeholder="어떤 시장을 어떻게 경험하셨는지 간단히 적어주세요.">${esc(p.career_summary || "")}</textarea>
      </div>

      <div class="field">
        <label for="note_to_admin">운영자(KK)에게 <span class="muted">(선택 · 심사용 비공개)</span></label>
        <textarea id="note_to_admin" maxlength="2000" placeholder="가입 동기나 함께 나누고 싶은 이야기가 있다면 자유롭게.">${esc(p.note_to_admin || "")}</textarea>
      </div>

      <button type="submit" class="btn btn-full" id="submit">가입 신청하기</button>
      <div class="msg" id="msg"></div>
      <div class="center"><button type="button" class="btn btn-ghost" id="out" style="margin-top:6px;">다른 계정으로 · 로그아웃</button></div>
    </form>`;

  const form = document.getElementById("onb");
  const nameEl = document.getElementById("display_name");
  const affEl = document.getElementById("affiliation");
  const showEl = document.getElementById("show_affiliation");
  const preview = document.getElementById("preview");

  function currentMode() { return form.querySelector('input[name="mode"]:checked').value; }
  function updatePreview() {
    const name = nameEl.value.trim() || "표시 이름";
    const showAff = showEl.checked && affEl.value.trim();
    preview.innerHTML = `프로필 표시: <b>${esc(name)}</b>${showAff ? " · " + esc(affEl.value.trim()) : ""}`;
  }
  form.querySelectorAll('input[name="mode"]').forEach((r) => r.addEventListener("change", () => {
    form.querySelectorAll(".segmented label").forEach((l) => l.classList.remove("checked"));
    form.querySelector(`label[for="${currentMode() === "real" ? "m-real" : "m-pseud"}"]`).classList.add("checked");
    updatePreview();
  }));
  [nameEl, affEl].forEach((el) => el.addEventListener("input", updatePreview));
  showEl.addEventListener("change", updatePreview);
  updatePreview();
  document.getElementById("out").onclick = async () => { await signOut(); render(); };

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("submit");
    msg.className = "msg"; msg.textContent = "";

    const payload = {
      identity_mode: currentMode(),
      display_name: nameEl.value.trim(),
      real_name: document.getElementById("real_name").value.trim() || null,
      field: document.getElementById("field").value,
      affiliation: affEl.value.trim() || null,
      show_affiliation: showEl.checked,
      career_summary: document.getElementById("career_summary").value.trim() || null,
      note_to_admin: document.getElementById("note_to_admin").value.trim() || null,
      onboarded: true,
    };
    if (!payload.display_name) { msg.className = "msg error"; msg.textContent = "표시 이름을 입력해 주세요."; return; }
    if (!payload.field) { msg.className = "msg error"; msg.textContent = "전문 분야를 선택해 주세요."; return; }

    btn.disabled = true; const orig = btn.textContent; btn.textContent = "신청 중…";
    const sb = getClient();
    const { error } = await sb.from("profiles").update(payload).eq("id", user.id);
    if (error) {
      msg.className = "msg error"; msg.textContent = "저장에 실패했습니다: " + error.message;
      btn.disabled = false; btn.textContent = orig; return;
    }
    // Notify the admin (email) that a new application arrived — fire-and-forget.
    try {
      const { data: { session } } = await sb.auth.getSession();
      const t = session && session.access_token;
      if (t) fetch("/api/notify-application", { method: "POST", headers: { Authorization: "Bearer " + t } }).catch(() => {});
    } catch (_) {}
    if (window.gtag) { try { gtag("event", "membership_apply"); } catch (_) {} }
    render();
  });
}

function renderStatus(user, p) {
  if (p.status === "approved") {
    root.innerHTML = `
      <div class="banner approved">🎉 승인되었습니다. KK &amp; Friends에 오신 것을 환영합니다.</div>
      <div class="card stack center">
        <div>${p.is_founding ? '<span class="badge badge-founding">Founding Member</span>' : ""}</div>
        <h2>${esc(p.display_name || "")} 님, 반갑습니다</h2>
        <p class="muted">이제 멤버 전용 라운지에서 글을 읽고 쓸 수 있습니다.</p>
        <a class="btn" href="/voices">Friends' Voices 입장 →</a>
        <a class="btn btn-outline" href="/me">내 프로필</a>
        <div><button class="btn btn-ghost" id="out">로그아웃</button></div>
      </div>`;
  } else if (p.status === "declined") {
    root.innerHTML = `
      <div class="card stack center">
        <h2>가입 안내</h2>
        <p class="muted">이번에는 함께하지 못하게 되었습니다. 문의가 있으시면 <a href="mailto:kim.kiseok.1969@gmail.com" style="color:var(--gold);">연락</a> 주세요.</p>
        <div><button class="btn btn-ghost" id="out">로그아웃</button></div>
      </div>`;
  } else if (p.status === "suspended") {
    root.innerHTML = `
      <div class="banner error">계정이 일시 정지되었습니다. 문의: <a href="mailto:kim.kiseok.1969@gmail.com" style="color:var(--gold);">kim.kiseok.1969@gmail.com</a></div>
      <div class="center"><button class="btn btn-ghost" id="out">로그아웃</button></div>`;
  } else {
    // pending
    root.innerHTML = `
      <div class="banner pending"><span class="badge badge-pending">심사 중</span> &nbsp;신청이 접수되었습니다. 운영자(KK)가 검토 후 이메일로 안내드립니다.</div>
      <div class="card stack">
        <h2>신청 내용</h2>
        <p><b>표시 이름</b> · ${esc(p.display_name || "")} <span class="muted">(${p.identity_mode === "real" ? "실명" : "필명"})</span></p>
        <p><b>전문 분야</b> · ${esc(p.field || "—")}</p>
        ${p.career_summary ? `<p><b>경력</b> · ${esc(p.career_summary)}</p>` : ""}
        <p class="muted">내용을 고치고 싶으시면 아래에서 수정할 수 있습니다.</p>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button class="btn btn-outline" id="edit">신청 내용 수정</button>
          <button class="btn btn-ghost" id="out">로그아웃</button>
        </div>
      </div>`;
    const edit = document.getElementById("edit");
    if (edit) edit.onclick = () => renderOnboarding(user, p);
  }
  const out = document.getElementById("out");
  if (out) out.onclick = async () => { await signOut(); render(); };
}
</script>
</body>
