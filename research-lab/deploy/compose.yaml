services:
  editorial:
    build:
      context: ../..
      dockerfile: research-lab/deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
    volumes:
      - editorial-state:/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  editorial-state:
