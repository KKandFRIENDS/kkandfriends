main{max-width:1120px}.editor-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}.status{font-size:13.5px;color:var(--text-muted)}.title-input,.summary-input,.slug-input{width:100%;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-family:inherit;padding:12px;margin-bottom:12px}.title-input{background:transparent;border-width:0 0 1px;border-radius:0;font-family:'Playfair Display','Noto Serif KR',serif;font-size:30px;padding-left:2px}.summary-input{min-height:86px;resize:vertical;font-size:15px;line-height:1.6}.meta-grid{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:14px}.meta-grid select{background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);padding:10px 12px}.field-label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.toolbar button{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);font-family:inherit;font-size:14px;padding:7px 12px;border-radius:4px;cursor:pointer}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}textarea.body{width:100%;min-height:540px;resize:vertical;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-family:'Source Serif 4','Noto Serif KR',serif;font-size:16px;line-height:1.8;padding:16px}.preview-pane{border:1px solid var(--border);border-radius:6px;padding:16px 20px;min-height:540px;background:var(--bg-card);overflow:auto}.preview-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}.rendered{color:var(--text-secondary);font-size:16.5px;line-height:1.85;word-break:keep-all}.rendered h2,.rendered h3,.rendered h4{color:var(--text-primary);margin:26px 0 12px}.rendered p{margin:0 0 14px}.rendered a{color:var(--gold)}.rendered img{max-width:100%;height:auto}.rendered blockquote{border-left:3px solid var(--gold-dim);padding-left:16px;color:var(--text-muted)}.rendered pre{background:var(--bg-hover);padding:14px;overflow:auto}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:20px}.actions .spacer{flex:1}.editor-note{font-size:13px;color:var(--text-muted);margin:8px 0 20px}.post-manager{margin-top:64px;border-top:1px solid var(--border);padding-top:28px}.post-list{display:grid;gap:10px}.post-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:6px;text-decoration:none;color:var(--text-primary);background:var(--bg-card)}.post-row small{display:block;color:var(--text-muted);margin-top:4px}.draft-tag{color:#E8A800}.published-tag{color:#70C99A}@media(max-width:820px){.split,.meta-grid{grid-template-columns:1fr}.preview-pane.mobile-hide{display:none}}
