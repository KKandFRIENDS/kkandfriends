<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>KK Daily · KK Weekly 글쓰기 — KK &amp; Friends</title>

<link rel="stylesheet" href="/member.css"><link rel="stylesheet" href="/typography.css"><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/site-footer.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
main{max-width:1080px}
.editor-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.series-tabs{display:flex;gap:8px;flex-wrap:wrap}.series-tab{border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);font-family:inherit;font-size:14px;padding:7px 14px;border-radius:999px;cursor:pointer}.series-tab.active{border-color:var(--gold);color:var(--text-primary);background:rgba(232,168,0,.12)}
.title-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text-primary);font-family:'Playfair Display','Noto Serif KR',serif;font-size:28px;padding:10px 2px;margin-bottom:16px}
.title-input:focus{outline:none;border-color:var(--gold)}.title-input::placeholder,.summary-input::placeholder{color:var(--text-muted)}
.meta-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.meta-row input{background:var(--bg-panel);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);font-family:inherit;font-size:14.5px;padding:8px 12px}
.meta-row #desk-label{min-width:220px;color:var(--text-secondary)}.meta-row .spacer{flex:1}.status{font-size:13.5px;color:var(--text-muted)}
.summary-input{width:100%;min-height:64px;resize:vertical;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font:inherit;font-size:15px;line-height:1.6;padding:12px 14px;margin-bottom:14px}
.summary-input:focus,textarea.body:focus,.source-card textarea:focus{outline:none;border-color:var(--gold)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar button{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);font-family:inherit;font-size:14px;padding:7px 12px;border-radius:4px;cursor:pointer;transition:all .15s}
.toolbar button:hover{border-color:var(--border-bright);color:var(--text-primary)}.toolbar-help{font-size:12.5px;color:var(--text-muted)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}
textarea.body{width:100%;min-height:520px;resize:vertical;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-family:'Source Serif 4','Noto Serif KR',serif;font-size:16px;line-height:1.8;padding:16px}
.preview-pane{border:1px solid var(--border);border-radius:6px;padding:16px 20px;min-height:520px;background:var(--bg-card);overflow-x:auto}
.preview-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px}
.rendered{color:var(--text-secondary);font-size:16px;line-height:1.85;word-break:keep-all}
.rendered h2{font-family:'Playfair Display','Noto Serif KR',serif;color:var(--text-primary);font-size:24px;margin:0 0 12px}
.rendered h3{font-family:'Playfair Display','Noto Serif KR',serif;color:var(--text-primary);font-size:19px;margin:22px 0 8px}.rendered h3 small{font-family:inherit;font-size:12px;font-weight:400}
.rendered p{margin:0 0 12px}.rendered .preview-warn{color:#e76f51;border-left:3px solid #e76f51;padding:6px 12px}.rendered blockquote{border-left:3px solid var(--gold-dim);padding:4px 16px;margin:0 0 16px;color:var(--text-muted)}
.source-card{border:1px solid var(--border);border-radius:6px;background:var(--bg-card);padding:14px 16px;margin-top:16px}
.source-card summary{cursor:pointer;color:var(--text-secondary);font-size:14px}
.source-card textarea{width:100%;min-height:120px;margin-top:12px;resize:vertical;background:var(--bg-panel);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.65;padding:12px}
.source-help{color:var(--text-muted);font-size:13px;line-height:1.6;margin:8px 0 0}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;align-items:center}.actions .spacer{flex:1}
.existing-note{border:1px solid var(--gold-dim);border-left:3px solid var(--gold);border-radius:6px;background:var(--bg-card);color:var(--text-secondary);font-size:14.5px;line-height:1.7;padding:12px 16px;margin-bottom:16px}.existing-note details{margin-top:8px}.existing-note summary{cursor:pointer}.existing-note p{margin:4px 0 0}
.review-check{display:flex;gap:8px;align-items:center;margin-top:18px;color:var(--text-secondary);font-size:14.5px;cursor:pointer}
.draft-list{margin-top:48px;border-top:1px solid var(--border);padding-top:24px}.draft-row{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;color:var(--text-primary);text-decoration:none}
@media(max-width:820px){.split{grid-template-columns:1fr}.preview-pane.mobile-hide{display:none}.meta-row #desk-label{min-width:0;flex:1 1 100%}}
</style>
</head>
