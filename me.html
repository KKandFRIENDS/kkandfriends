<main>

<footer>
  <div class="footer-logo">KK<span>&</span>FRIENDS</div>

  <div style="display:flex;gap:20px;">

<script type="module">
import {
  isConfigured, getClient, currentUser, onAuthChange,
  signOut, fetchMyProfile, esc, IDENTITY_FIELDS,
} from "/js/auth.js";

const root = document.getElementById("root");
const STATUS_LABEL = { pending: "심사 중", approved: "승인됨", declined: "미승인", suspended: "정지" };
const STATUS_BADGE = { pending: "badge-pending", approved: "badge-approved", declined: "badge-declined", suspended: "badge-declined" };

boot();
async function boot() {
  if (!isConfigured()) {
    root.innerHTML = `<div class="banner error">회원 시스템이 아직 연결되지 않았습니다.</div>`; return;
  }
  onAuthChange(() => render());
  await render();
}

async function render() {
  const user = await currentUser();
  if (!user) {
    root.innerHTML = `
      <div class="card center stack">
        <p class="muted">로그인이 필요합니다.</p>
        <a class="btn" href="/join">가입 · 로그인 페이지로 →</a>
      </div>`;
    return;
  }
  let p = await fetchMyProfile();
  if (!p) { root.innerHTML = `<div class="banner error">프로필을 불러오지 못했습니다.</div>`; return; }
  if (!p.onboarded) {
    root.innerHTML = `<div class="card center stack"><p class="muted">아직 프로필 작성을 마치지 않으셨습니다.</p><a class="btn" href="/join">프로필 작성하기 →</a></div>`;
    return;
  }
  renderView(user, p);
}

function renderView(user, p) {
  const badge = p.status === "approved" && p.is_founding
    ? `<span class="badge badge-founding">Founding Member</span> `
    : "";
  const statusBadge = `<span class="badge ${STATUS_BADGE[p.status]}">${STATUS_LABEL[p.status] || p.status}</span>`;
  const showAff = p.show_affiliation && p.affiliation;

  root.innerHTML = `
    ${p.status === "pending" ? `<div class="banner pending">${statusBadge} &nbsp;운영자 검토를 기다리고 있습니다.</div>` : ""}
    ${p.status === "suspended" ? `<div class="banner error">계정이 일시 정지되었습니다.</div>` : ""}
    <div class="card">
      <div class="profile-head">
        ${p.avatar_url ? `<img class="avatar" src="${esc(p.avatar_url)}" alt="">` : `<div class="avatar"></div>`}
        <div class="who">
          <h2>${esc(p.display_name || "")}</h2>
          <div style="margin-top:6px;">${badge}${p.status !== "pending" ? statusBadge : ""}</div>
        </div>
      </div>
      <dl class="kv">
        <dt>표시 방식</dt><dd>${p.identity_mode === "real" ? "실명" : "필명"}</dd>
        <dt>전문 분야</dt><dd>${esc(p.field || "—")}</dd>
        ${showAff ? `<dt>소속 (공개)</dt><dd>${esc(p.affiliation)}</dd>` : ""}
        ${p.career_summary ? `<dt>경력</dt><dd>${esc(p.career_summary)}</dd>` : ""}
      </dl>
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);" class="muted">
        <div>본명 (비공개): ${esc(p.real_name || "—")}</div>
        <div>이메일 (비공개): ${esc(p.contact_email || user.email || "—")}</div>
        ${p.affiliation && !p.show_affiliation ? `<div>소속 (비공개): ${esc(p.affiliation)}</div>` : ""}
      </div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      ${p.status === "approved" ? `<a class="btn" href="/voices">Friends' Voices 라운지</a><a class="btn btn-outline" href="/write">＋ 글쓰기</a>` : ""}
      <button class="btn btn-outline" id="edit">프로필 수정</button>
      <button class="btn btn-ghost" id="out">로그아웃</button>
    </div>`;
  document.getElementById("edit").onclick = () => renderEdit(user, p);
  document.getElementById("out").onclick = async () => { await signOut(); render(); };
}

// Centre-crop to a square and downscale before upload: a 10MB phone photo
// becomes a ~60KB avatar, which keeps it well under the bucket's 5MB cap and
// makes member lists load fast. Also normalises orientation-neutral output.
function squareThumbnail(file, size) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const side = Math.min(img.width, img.height);
      if (!side) { reject(new Error("이미지 크기를 읽지 못했습니다.")); return; }
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = Math.min(size, side);
      canvas.getContext("2d").drawImage(
        img,
        (img.width - side) / 2, (img.height - side) / 2, side, side,
        0, 0, canvas.width, canvas.height
      );
      canvas.toBlob(
        (b) => (b ? resolve(b) : reject(new Error("이미지를 변환하지 못했습니다."))),
        "image/jpeg", 0.88
      );
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("이미지를 읽지 못했습니다.")); };
    img.src = url;
  });
}

function renderEdit(user, p) {
  const fieldOpts = IDENTITY_FIELDS.map(
    (f) => `<option value="${esc(f)}" ${p.field === f ? "selected" : ""}>${esc(f)}</option>`
  ).join("");
  const realChecked = (p.identity_mode || "pseudonym") === "real";

  root.innerHTML = `
    <form id="edit" class="card stack" novalidate>
      <h2>프로필 수정</h2>
      <div class="field">
        <label>프로필 사진</label>
        <div class="avatar-edit">
          <div class="avatar-lg" id="av-img"${p.avatar_url ? ` style="background-image:url('${esc(p.avatar_url)}')"` : ""}></div>
          <div>
            <div class="btns">
              <button type="button" class="btn btn-outline" id="av-pick">사진 선택</button>
              <button type="button" class="btn btn-ghost" id="av-clear">사진 없애기</button>
            </div>
            <div class="avatar-hint" id="av-hint">JPG · PNG · WebP · 정사각형으로 잘려 저장됩니다.</div>
          </div>
        </div>
        <input type="file" id="av-file" accept="image/*" hidden>
      </div>
      <div class="field">
        <label>표시 방식</label>
        <div class="segmented">
          <div style="flex:1;position:relative;">
            <input type="radio" name="mode" value="real" id="m-real" ${realChecked ? "checked" : ""}>
            <label for="m-real" class="${realChecked ? "checked" : ""}"><span class="t">실명</span></label>
          </div>
          <div style="flex:1;position:relative;">
            <input type="radio" name="mode" value="pseudonym" id="m-pseud" ${!realChecked ? "checked" : ""}>
            <label for="m-pseud" class="${!realChecked ? "checked" : ""}"><span class="t">필명</span></label>
          </div>
        </div>
      </div>
      <div class="field"><label for="display_name">표시 이름 <span style="color:var(--red)">*</span></label>
        <input type="text" id="display_name" maxlength="60" value="${esc(p.display_name || "")}"></div>
      <div class="field"><label for="real_name">본명 <span class="muted">(비공개)</span></label>
        <input type="text" id="real_name" maxlength="60" value="${esc(p.real_name || "")}"></div>
      <div class="field"><label for="field">전문 분야 <span style="color:var(--red)">*</span></label>
        <select id="field"><option value="">— 선택 —</option>${fieldOpts}</select></div>
      <div class="field"><label for="affiliation">소속 <span class="muted">(선택)</span></label>
        <input type="text" id="affiliation" maxlength="120" value="${esc(p.affiliation || "")}">
        <div class="check-row" style="margin-top:12px;">
          <input type="checkbox" id="show_affiliation" ${p.show_affiliation ? "checked" : ""}>
          <label for="show_affiliation">소속을 프로필에 공개합니다.</label>
        </div></div>
      <div class="field"><label for="career_summary">경력 소개 <span class="muted">(최대 1000자)</span></label>
        <textarea id="career_summary" maxlength="1000">${esc(p.career_summary || "")}</textarea></div>
      ${"digest_opt_in" in p ? `<div class="field"><div class="check-row">
        <input type="checkbox" id="digest_opt_in" ${p.digest_opt_in ? "checked" : ""}>
        <label for="digest_opt_in">주간 라운지 소식 이메일을 받습니다 (새 글·모임 요약).</label>
      </div></div>` : ""}
      ${"daily_brief_optin" in p ? `<div class="field"><div class="check-row">
        <input type="checkbox" id="daily_brief_optin" ${p.daily_brief_optin ? "checked" : ""}>
        <label for="daily_brief_optin">평일 아침 <b>글로벌 마켓 브리핑</b> 알림을 받습니다.</label>
      </div></div>` : ""}
      <div style="display:flex;gap:12px;flex-wrap:wrap;">
        <button type="submit" class="btn" id="save">저장</button>
        <button type="button" class="btn btn-ghost" id="cancel">취소</button>
      </div>
      <div class="msg" id="msg"></div>
    </form>`;

  // ── Profile photo ──────────────────────────────────────────────────────────
  // Uploads reuse the existing `post-images` bucket (members-only INSERT, public
  // read — shipped in migration 010) under an `avatars/` prefix, so no new
  // Storage configuration is needed. The new URL is only written to the profile
  // when the form is saved.
  let avatarUrl = p.avatar_url || null;
  const avImg = document.getElementById("av-img");
  const avFile = document.getElementById("av-file");
  const avHint = document.getElementById("av-hint");
  const setAvatar = (url) => {
    avatarUrl = url;
    avImg.style.backgroundImage = url ? `url('${url}')` : "";
  };

  document.getElementById("av-pick").onclick = () => avFile.click();
  document.getElementById("av-clear").onclick = () => {
    setAvatar(null);
    avHint.textContent = "저장을 누르면 사진이 없어집니다.";
  };

  avFile.addEventListener("change", async () => {
    const file = avFile.files[0];
    avFile.value = "";                       // let the same file be picked again
    if (!file) return;
    if (!file.type.startsWith("image/")) { avHint.textContent = "이미지 파일만 올릴 수 있습니다."; return; }
    if (file.size > 15 * 1024 * 1024) { avHint.textContent = "15MB 이하 이미지만 올릴 수 있습니다."; return; }

    avHint.textContent = "사진 올리는 중…";
    try {
      const blob = await squareThumbnail(file, 512);
      const sb = getClient();
      const path = `avatars/${user.id}-${Date.now()}.jpg`;
      const { error } = await sb.storage
        .from("post-images")
        .upload(path, blob, { contentType: "image/jpeg", upsert: false });
      if (error) throw error;
      const { data } = sb.storage.from("post-images").getPublicUrl(path);
      setAvatar(data.publicUrl);
      avHint.textContent = "사진이 바뀌었습니다. 아래 저장을 눌러야 적용됩니다.";
    } catch (err) {
      avHint.textContent = "업로드 실패: " + (err.message || err);
    }
  });

  const form = document.getElementById("edit");
  form.querySelectorAll('input[name="mode"]').forEach((r) => r.addEventListener("change", () => {
    form.querySelectorAll(".segmented label").forEach((l) => l.classList.remove("checked"));
    const v = form.querySelector('input[name="mode"]:checked').value;
    form.querySelector(`label[for="${v === "real" ? "m-real" : "m-pseud"}"]`).classList.add("checked");
  }));
  document.getElementById("cancel").onclick = () => renderView(user, p);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("msg");
    const btn = document.getElementById("save");
    msg.className = "msg"; msg.textContent = "";
    const payload = {
      identity_mode: form.querySelector('input[name="mode"]:checked').value,
      display_name: document.getElementById("display_name").value.trim(),
      real_name: document.getElementById("real_name").value.trim() || null,
      field: document.getElementById("field").value,
      affiliation: document.getElementById("affiliation").value.trim() || null,
      show_affiliation: document.getElementById("show_affiliation").checked,
      career_summary: document.getElementById("career_summary").value.trim() || null,
    };
    const digestEl = document.getElementById("digest_opt_in");
    if (digestEl) payload.digest_opt_in = digestEl.checked;
    const briefEl = document.getElementById("daily_brief_optin");
    if (briefEl) payload.daily_brief_optin = briefEl.checked;
    // Only send avatar_url when it actually changed, so saving a profile still
    // works on a database where migration 013 (the column GRANT) hasn't run yet.
    if (avatarUrl !== (p.avatar_url || null)) payload.avatar_url = avatarUrl;
    if (!payload.display_name) { msg.className = "msg error"; msg.textContent = "표시 이름을 입력해 주세요."; return; }
    if (!payload.field) { msg.className = "msg error"; msg.textContent = "전문 분야를 선택해 주세요."; return; }
    btn.disabled = true; const orig = btn.textContent; btn.textContent = "저장 중…";
    const sb = getClient();
    const { error } = await sb.from("profiles").update(payload).eq("id", user.id);
    if (error) { msg.className = "msg error"; msg.textContent = "저장 실패: " + error.message; btn.disabled = false; btn.textContent = orig; return; }
    const fresh = await fetchMyProfile();
    renderView(user, fresh || { ...p, ...payload });
  });
}
</script>
<script type="module">
import { unreadNotifications } from "/js/auth.js";
unreadNotifications().then((n) => {
  if (n > 0) { const a = document.getElementById("notif-link");
    if (a) a.innerHTML = `🔔 알림 <span style="background:var(--gold);color:#061018;border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;">${n > 9 ? "9+" : n}</span>`; }
}).catch(() => {});
</script>
