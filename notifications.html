<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0A0E1A">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알림 · Notifications — KK &amp; Friends</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Noto+Serif+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/member.css">
<style>
  main { max-width: 680px; }
  .notif { display:flex; align-items:flex-start; gap:12px; text-decoration:none;
    background:var(--bg-card); border:1px solid var(--border); border-radius:8px; padding:16px 18px; margin-bottom:10px; transition:border-color .2s; }
  .notif:hover { border-color:var(--border-bright); }
  .notif.unread { border-left:3px solid var(--gold); }
  .notif .avatar-xs { width:34px; height:34px; border-radius:50%; border:1px solid var(--border); object-fit:cover; background:var(--bg-panel); flex-shrink:0; }
  .notif .txt { color:var(--text-secondary); font-size:14.5px; line-height:1.55; }
  .notif .txt b { color:var(--text-primary); }
  .notif .when { color:var(--text-muted); font-size:12.5px; margin-top:4px; }
  .notif .ic { font-size:15px; }
  .empty { text-align:center; color:var(--text-muted); padding:56px 0; }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="/">
    <img src="/KK_and_FRIENDS.png" alt="KK & Friends">
    <span class="nav-logo-text">
      <span class="nav-logo-kk">KK &amp; FRIENDS</span>
      <span class="nav-logo-sub">알림</span>
    </span>
  </a>
  <div class="nav-right">
    <a href="/voices">라운지</a>
    <a href="/members">멤버</a>
    <a href="/events">모임</a>
    <a href="/me">내 프로필</a>
  </div>
</nav>

<main>
  <div class="eyebrow">Notifications</div>
  <h1 class="page-title">알림</h1>
  <div id="root"><div class="spinner"></div></div>
</main>

<script type="module">
import {
  isConfigured, getClient, currentUser, signInWithGoogle, esc, fetchPublicProfiles,
} from "/js/auth.js";

const root = document.getElementById("root");

const TEXT = {
  comment:      (n) => `<b>${n}</b>님이 회원님의 글에 <b>댓글</b>을 남겼습니다.`,
  reply:        (n) => `<b>${n}</b>님이 회원님의 댓글에 <b>답글</b>을 남겼습니다.`,
  post_like:    (n) => `<b>${n}</b>님이 회원님의 글을 <b>좋아합니다</b>.`,
  comment_like: (n) => `<b>${n}</b>님이 회원님의 댓글을 <b>좋아합니다</b>.`,
};
const ICON = { comment: "💬", reply: "↩️", post_like: "👍", comment_like: "👍" };

boot();
async function boot() {
  if (!isConfigured()) { root.innerHTML = `<div class="banner error">회원 시스템이 아직 연결되지 않았습니다.</div>`; return; }
  const user = await currentUser();
  if (!user) {
    root.innerHTML = `<div class="card center stack"><p class="muted">로그인이 필요합니다.</p>
      <button class="btn" id="signin">Google로 로그인</button></div>`;
    document.getElementById("signin").onclick = () => signInWithGoogle(location.href);
    return;
  }

  const sb = getClient();
  const { data, error } = await sb.from("notifications")
    .select("*").eq("user_id", user.id)
    .order("created_at", { ascending: false }).limit(60);
  if (error) { root.innerHTML = `<div class="banner error">불러오기 실패: ${esc(error.message)}</div>`; return; }
  if (!data || !data.length) {
    root.innerHTML = `<div class="empty">아직 알림이 없습니다.<br>글을 남기고 다른 멤버들과 이야기를 시작해 보세요.</div>`;
    return;
  }

  const profiles = await fetchPublicProfiles(data.map((n) => n.actor_id));
  root.innerHTML = data.map((n) => {
    const actor = profiles[n.actor_id];
    const name = esc(actor?.display_name || n.actor_name || "누군가");
    const avatar = actor?.avatar_url ? `<img class="avatar-xs" src="${esc(actor.avatar_url)}" alt="">` : `<span class="avatar-xs"></span>`;
    const href = n.member_post_id ? `/voices?id=${n.member_post_id}` : "/voices";
    const line = (TEXT[n.type] || (() => "새 알림"))(name);
    return `<a class="notif ${n.is_read ? "" : "unread"}" href="${href}">
      ${avatar}
      <div>
        <div class="txt"><span class="ic">${ICON[n.type] || "🔔"}</span> ${line}</div>
        <div class="when">${timeAgo(n.created_at)}</div>
      </div>
    </a>`;
  }).join("");

  // Mark everything read now that they've been seen.
  const unreadIds = data.filter((n) => !n.is_read).map((n) => n.id);
  if (unreadIds.length) {
    sb.from("notifications").update({ is_read: true }).in("id", unreadIds).then(() => {});
  }
}

function timeAgo(ts) {
  const d = new Date(ts), s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "방금 전";
  if (s < 3600) return `${Math.floor(s / 60)}분 전`;
  if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
  if (s < 604800) return `${Math.floor(s / 86400)}일 전`;
  return d.toLocaleDateString("ko-KR");
}
</script>
</body>
</html>
